name: Morning Brief
on:
  schedule:
    # 12:00 UTC = 5 AM PDT, 13:00 UTC = 5 AM PST; scripts/run-brief.ts skips the one that isn't 5 AM PT.
    - cron: "0 12,13 * * 1-5"
  workflow_dispatch:
    inputs:
      force: { description: "Rebuild today now", type: boolean, default: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/run-brief.ts
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: 665b9368-a0ba-4522-bee6-02951d272356
          FRED_KEY: ${{ secrets.FRED_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
