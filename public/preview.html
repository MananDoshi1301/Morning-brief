<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<!-- Redesign preview: single-column edition. Same /api as the app; read-only. -->
<script>try{var t=localStorage.getItem("mb-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root {
  --paper: #FAF7F2; --card: #FFFFFF; --ink: #1C1B19; --ink-2: #57534E; --ink-3: #8A847C;
  --rule: #E7E2D9; --accent: #2859A6; --accent-soft: #E8EEF8; --amber: #A2620A; --amber-soft: #FBF1DF;
  --pos: #1F7A4D; --neg: #B3261E;
  --serif: "Newsreader", Georgia, serif; --sans: "IBM Plex Sans", -apple-system, system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141414; --card: #1B1B1A; --ink: #E6E3DE; --ink-2: #ABA59C; --ink-3: #847E75;
  --rule: #2A2826; --accent: #8FB4F2; --accent-soft: #1B2638; --amber: #E3A94F; --amber-soft: #2A2216; --pos: #5BC48F; --neg: #EE7F7F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #141414; --card: #1B1B1A; --ink: #E6E3DE; --ink-2: #ABA59C; --ink-3: #847E75;
  --rule: #2A2826; --accent: #8FB4F2; --accent-soft: #1B2638; --amber: #E3A94F; --amber-soft: #2A2216; --pos: #5BC48F; --neg: #EE7F7F; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

/* top bar: brand + 3 destinations, nothing else */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 20px; height: 52px; }
.brand { font: 600 19px/1 var(--serif); letter-spacing: -0.01em; margin-right: auto; }
.bar nav { display: flex; gap: 18px; font-size: 14px; color: var(--ink-2); }
.bar nav a[aria-current] { color: var(--ink); font-weight: 500; }
.bar nav a:hover { color: var(--ink); }
.theme { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 6px; display: grid; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .1s linear; }

/* masthead */
.mast { padding: 40px 0 8px; }
.mast h1 { margin: 0; font: 500 36px/1.1 var(--serif); letter-spacing: -0.02em; }
.meta { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
.meta b { color: var(--ink); font-weight: 500; }
.insight { margin: 24px 0 0; padding: 14px 16px; background: var(--accent-soft); border-radius: 8px; font: 400 17px/1.5 var(--serif); }
.insight span { display: block; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.failed { margin: 24px 0 0; padding: 12px 16px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 15px; }

/* sections */
.sec { padding-top: 40px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.sec-h h2 { margin: 0; font: 600 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.sec-h small { color: var(--ink-3); font-size: 13px; }

/* one story shape everywhere: label, headline, what happened, why it matters, source */
.story { padding: 20px 0; border-bottom: 1px solid var(--rule); }
.story:last-child { border-bottom: 0; }
.kicker { font: 600 12px/1 var(--sans); letter-spacing: .04em; color: var(--accent); }
.kicker .flag { color: var(--amber); margin-left: 6px; }
.story h3 { margin: 6px 0 6px; font: 500 21px/1.3 var(--serif); letter-spacing: -0.005em; }
.story h3 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.story p { margin: 0; color: var(--ink-2); max-width: 64ch; }
.story .why { margin-top: 8px; color: var(--ink); }
.story .why b { font-weight: 600; }
.src { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink-3); }
.src a { color: var(--accent); }
.lead h3 { font-size: 28px; line-height: 1.2; letter-spacing: -0.015em; }
.lead p { font-size: 17px; }

/* progressive disclosure for paper / incident / release notes */
details { margin-top: 10px; font-size: 14px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+ "; }
details[open] summary::before { content: "– "; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; color: var(--ink-2); }
dt { color: var(--ink-3); }
dd { margin: 0; }

/* markets: facts in rows, numbers in mono */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.rows li:last-child { border-bottom: 0; }
.tk { font: 500 13px/1.6 var(--mono); color: var(--ink); }
.rows .note { color: var(--ink-3); font-size: 13px; }
.sub-h { margin: 24px 0 0; font: 600 13px/1 var(--sans); color: var(--ink-2); }
.none { color: var(--ink-3); font-size: 15px; padding: 16px 0; }

/* end of the edition */
.done { margin: 48px 0 0; padding: 28px 0; border-top: 1px solid var(--ink); text-align: center; }
.done .check { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.done h2 { margin: 12px 0 4px; font: 500 22px/1.2 var(--serif); }
.done p { margin: 0; color: var(--ink-2); font-size: 15px; }
footer { padding: 16px 0 48px; color: var(--ink-3); font-size: 13px; text-align: center; }
footer .warn { color: var(--amber); }

.preview-tag { position: fixed; right: 12px; bottom: 12px; font-size: 12px; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 99px; }
.preview-tag a { text-decoration: underline; }

@media (max-width: 600px) {
  .bar nav { gap: 14px; }
  .mast { padding-top: 28px; } .mast h1 { font-size: 28px; }
  .lead h3 { font-size: 24px; } .story h3 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { .progress { transition: none; } }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/preview">Morning Brief</a>
  <nav aria-label="Main"><a href="/preview" aria-current="page">Today</a><a href="/#archive">Archive</a><a href="/#saved">Saved</a></nav>
  <button class="theme" id="theme" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <div class="progress" id="progress"></div>
</div></header>
<main class="wrap" id="main"><p class="none" style="padding-top:48px">Loading today's brief…</p></main>
<div class="preview-tag">Design preview · <a href="/">current app</a></div>
<script src="/demo.js"></script>
<script>
(async () => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const PT = { timeZone: "America/Los_Angeles" };
  const time = (t) => t ? new Date(t).toLocaleTimeString("en-US", { ...PT, hour: "numeric", minute: "2-digit" }) : "";
  const day = (d) => new Date(`${d}T12:00:00Z`).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  let b, demo = false;
  try {
    const r = await fetch("/api/brief/latest", { credentials: "same-origin" });
    if (r.status === 403) { location.href = "/"; return; } // signed out: the app has the sign-in page
    if (!r.ok) throw new Error(r.status);
    b = (await r.json()).brief;
    if (!b) throw new Error("no brief yet");
  } catch { b = window.MB_DEMO.brief; demo = true; }

  const S = b.sections || {}, M = b.markets || {};
  const byId = new Map([...(S.core || []), ...(S.ai || []), ...(S.industry || []), ...(M.news || [])].map((s) => [s.id, s]));
  const leadId = b.top?.[0]?.id;
  const count = byId.size;
  const words = [...byId.values()].reduce((n, s) => n + `${s.title} ${s.summary} ${s.why}`.split(/\s+/).length, 0);
  const minutes = Math.max(1, Math.round(words / 230));

  const notes = (s) => {
    const rows = s.paper ? [["Problem", s.paper.problem], ["Idea", s.paper.idea], ["In practice", s.paper.practice]]
      : s.incident ? [["Trigger", s.incident.trigger], ["Failure", s.incident.failure], ["Lesson", s.incident.lesson]]
      : s.release ? [["Changed", s.release.changed], ["Consequence", s.release.consequence]] : null;
    if (!rows) return "";
    const label = s.paper ? "Paper notes" : s.incident ? "Incident notes" : "Release notes";
    return `<details><summary>${label}</summary><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>`;
  };
  const story = (s, lead) => `<article class="story${lead ? " lead" : ""}">
    <div class="kicker">${lead ? "Lead · " : ""}${esc(s.topic || "")}${s.unconfirmed ? `<span class="flag">Unconfirmed</span>` : ""}</div>
    <h3><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></h3>
    <p>${esc(s.summary)}</p>
    <p class="why"><b>Why it matters:</b> ${esc(s.why)}</p>
    ${notes(s)}
    <div class="src"><span>${esc(s.source)}${s.published ? ` · ${time(s.published)}` : ""}</span>${s.also?.length ? `<span>Also: ${s.also.map(esc).join(", ")}</span>` : ""}</div>
  </article>`;
  const section = (title, list, sub = "") => {
    const items = (list || []).filter((s) => s.id !== leadId);
    return items.length ? `<section class="sec"><div class="sec-h"><h2>${title}</h2>${sub ? `<small>${sub}</small>` : ""}</div>${items.map((s) => story(s)).join("")}</section>` : "";
  };

  const cal = M.calendar || [], filings = (M.watchlist || []).flatMap((w) => (w.filings || []).map((f) => ({ ...f, company: w.company })));
  const markets = (M.news?.length || cal.length || filings.length) ? `<section class="sec"><div class="sec-h"><h2>Markets</h2><small>News and events</small></div>
    ${cal.length ? `<p class="sub-h">On the calendar today</p><ul class="rows">${cal.map((e) => `<li><span class="tk">${e.type === "earnings" ? "EARN" : "MACRO"}</span><span>${esc(e.name)}${e.timing ? ` · ${esc(e.timing)}` : ""}${e.why ? `<br><span class="note">${esc(e.why)}</span>` : ""}</span></li>`).join("")}</ul>` : ""}
    ${filings.length ? `<p class="sub-h">Watchlist filings</p><ul class="rows">${filings.map((f) => `<li><span class="tk">${esc(f.ticker)}</span><span><a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--accent)">Form ${esc(f.form)}</a> · ${esc(f.date)}${f.explain ? `<br><span class="note">${esc(f.explain)}</span>` : ""}</span></li>`).join("")}</ul>` : ""}
    ${(M.news || []).filter((s) => s.id !== leadId).map((s) => story(s)).join("")}
  </section>` : "";

  const lead = byId.get(leadId);
  const missing = b.missing || [];
  const failed = b.status === "failed" || b.status === "running";
  document.getElementById("main").innerHTML = `
    <section class="mast">
      <h1>${esc(day(b.date))}</h1>
      <p class="meta"><b>${count} stories</b> · ${minutes} min read${b.generatedAt ? ` · ready at ${time(b.generatedAt)}` : ""}${demo ? " · sample data" : ""}</p>
      ${failed ? `<div class="failed">${b.status === "running" ? "Today's brief is still being built. Reload in a few minutes." : `This brief failed to build. ${esc(b.error || "")}`}</div>` : ""}
      ${b.insight?.text ? `<div class="insight"><span>Today's thread</span>${esc(b.insight.text)}</div>` : ""}
    </section>
    ${lead ? `<section class="sec" style="padding-top:24px">${story(lead, true)}</section>` : ""}
    ${section("Core tech", S.core, "Databases, systems, kernels")}
    ${section("AI & infrastructure", S.ai)}
    ${section("Industry & culture", S.industry)}
    ${markets}
    ${count ? "" : `<p class="none">No stories in this issue.</p>`}
    <section class="done" id="done">
      <div class="check" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l5 5L20 7"/></svg></div>
      <h2>You're caught up.</h2>
      <p>The next brief arrives tomorrow at 5 AM.</p>
    </section>
    <footer>${b.sourcesChecked ? `${b.sourcesChecked - missing.length} of ${b.sourcesChecked} sources` : "Sources"} fetched${missing.length ? ` · <span class="warn">unavailable: ${missing.map((m) => esc(String(m).split(" (")[0])).join(", ")}</span>` : ""}</footer>`;
  document.title = `Morning Brief · ${day(b.date)}`;

  // Reading progress toward the "caught up" line, not the page bottom.
  const bar = document.getElementById("progress"), done = document.getElementById("done");
  const onScroll = () => { const end = done.offsetTop - innerHeight + 120; bar.style.width = `${Math.min(100, Math.max(0, (scrollY / Math.max(1, end)) * 100))}%`; };
  addEventListener("scroll", onScroll, { passive: true }); onScroll();

  document.getElementById("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("mb-theme", document.documentElement.dataset.theme); } catch {}
  };
})();
</script>
</body>
</html>
